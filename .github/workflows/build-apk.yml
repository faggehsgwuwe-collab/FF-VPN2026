name: Build FF VPN APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # সব ফাইল এক লাইনে (ফ্ল্যাট) আছে। ফাইলের নামের "__" কে "/" বানিয়ে ফোল্ডার তৈরি করা হচ্ছে।
      - name: Restore folder structure
        run: |
          shopt -s nullglob dotglob
          for f in *__*; do
            [ -f "$f" ] || continue
            dest="${f//__//}"
            mkdir -p "$(dirname "$dest")"
            mv "$f" "$dest"
          done
          find . -path ./.git -prune -o -type f -print | sort | head -100

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FF-VPN-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
